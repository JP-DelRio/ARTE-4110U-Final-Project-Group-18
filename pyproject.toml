
[project]
name = "arte-4110u-final-project-group-18"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JonathanLeaper", email = "jonathan.leaper@ontariotechu.net" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "jupyter>=1.1.1",
    "kagglehub>=1.0.3",
    "librosa>=1.0.1",
    "matplotlib>=3.11.2",
    "notebook>=7.6.5",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

[project.scripts]
arte-4110u-final-project-group-18 = "arte_4110u_final_project_group_18:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]
